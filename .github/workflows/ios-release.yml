name: iOS Release to App Store

# Required repository secrets
# ---------------------------
#   IOS_DIST_CERT_BASE64          base64 of the Apple Distribution .p12
#   IOS_DIST_CERT_PASSWORD        password for that .p12
#   APP_STORE_CONNECT_ISSUER_ID   App Store Connect API issuer id
#   APP_STORE_CONNECT_KEY_ID      App Store Connect API key id
#   APP_STORE_CONNECT_API_KEY     the .p8 private key contents
#   APPLE_TEAM_ID                 the 10-character team id. Rextory's is
#                                 P6733MSWNR; if Dotto ships from the same Apple
#                                 developer account it is the same value, but it
#                                 is a secret here rather than hardcoded because
#                                 that has NOT been confirmed for this app.
#
# VERIFIED. This pipeline has archived, signed and delivered to TestFlight
# (1.0.3, builds 6 and 7). It is adapted from the Rextory workflow and now
# matches it where it counts: manual signing declared in the Xcode project, the
# App Store profile fetched through the API rather than committed, and CocoaPods
# forced over Swift Package Manager.
#
# Two things worth knowing when it next breaks:
#
#   * The profile name in ExportOptions below, "com.karimkod.dotto AppStore",
#     must match the profile in the developer portal exactly. It does today. A
#     mismatch fails the export step *after* a successful archive, which is a
#     confusing place to land.
#   * IPHONEOS_DEPLOYMENT_TARGET is 15.0, raised from 14.0 after Apple returned
#     ITMS-90068 against build 7: from Spring 2027 an upload must declare 15.0
#     or later. That and the Xcode version below are the two knobs for when
#     Apple next moves the floor.
#   * Profiles are downloaded per run through the App Store Connect API — there
#     is no profile in a secret and no Fastlane match. That means a portal
#     change is picked up automatically, with one exception: adding a capability
#     to the App ID invalidates existing profiles instead of updating them, and
#     the invalid one is what the API keeps handing out until it is regenerated
#     by hand. The verify step below exists for exactly that case.
#   * CocoaPods is pinned, so every iOS plugin needs a podspec. A dependency
#     that ships only a Package.swift fails here at `flutter pub get`, before
#     anything is built — and does not fail on Windows or Linux, where the iOS
#     tooling never runs. test/ios_plugins_test.dart runs that check locally.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Override build number (CFBundleVersion). Defaults to the GitHub run number.'
        required: false
        type: string

permissions:
  contents: write

env:
  # Matches the Android workflow and the locally verified toolchain.
  FLUTTER_VERSION: '3.41.9'

jobs:
  build-and-upload:
    name: Build & Upload iOS to App Store Connect
    # Apple requires a recent Xcode for App Store uploads; macos-26 defaults to
    # Xcode 26, where macos-15 only ships Xcode 16.
    runs-on: macos-26
    # Pods plus xcodebuild archive run long; a named bound surfaces a runner
    # SIGTERM as a clear timeout rather than an opaque cancel.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get version from tag or pubspec
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "Using version from tag: $VERSION"
            if [[ $VERSION == *"+"* ]]; then
              VERSION_NAME=${VERSION%+*}
              BUILD_NUMBER=${VERSION#*+}
            else
              VERSION_NAME=$VERSION
              BUILD_NUMBER=${{ github.run_number }}
            fi
          else
            VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
            VERSION_NAME=${VERSION%+*}
            BUILD_NUMBER=${{ github.run_number }}
            echo "Using version from pubspec.yaml: $VERSION"
          fi

          # A manual override wins, so a re-run can bump the build number —
          # App Store Connect rejects a build number it has already seen.
          if [[ -n "${{ github.event.inputs.build_number }}" ]]; then
            BUILD_NUMBER=${{ github.event.inputs.build_number }}
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Version Name: $VERSION_NAME, Build Number: $BUILD_NUMBER"

      # The local build this workflow was verified against ran with SPM off, so
      # the CocoaPods path is the one known to archive cleanly here. Pinning it
      # keeps CI on that path regardless of the Flutter version's default.
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Flutter dependencies
        run: flutter pub get

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Download App Store provisioning profile
        uses: apple-actions/download-provisioning-profiles@v3
        with:
          bundle-id: com.karimkod.dotto
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

      # The profile is fetched fresh above, so it is always whatever the portal
      # currently holds — but "current" is not the same as "correct". Enabling a
      # capability on an App ID does NOT regenerate the profiles that reference
      # it; Apple marks them invalid and waits for someone to press the button.
      # A profile missing an entitlement the app declares fails in codesign,
      # deep inside the archive step, with a message that names neither the
      # profile nor the capability. This turns that into one line, before any
      # build time is spent.
      - name: Verify the profile carries the entitlements the app declares
        run: |
          set -uo pipefail
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          DECODED=$(mktemp)
          missing=""

          # Every entitlement key the app asks for, paired with what has to be
          # switched on in the developer portal to satisfy it.
          check() {
            local key="$1" capability="$2" found=0
            for p in "$DIR"/*.mobileprovision; do
              [ -e "$p" ] || continue
              security cms -D -i "$p" > "$DECODED" 2>/dev/null || continue
              grep -q "com.karimkod.dotto" "$DECODED" || continue
              if grep -q "$key" "$DECODED"; then found=1; break; fi
            done
            if [ "$found" -ne 1 ]; then
              echo "::error::Profile is missing '$key'. Enable $capability on the com.karimkod.dotto App ID, REGENERATE the 'com.karimkod.dotto AppStore' profile (enabling a capability invalidates it rather than updating it), and re-run."
              missing="yes"
            else
              echo "ok: $key"
            fi
          }

          check "aps-environment" "Push Notifications"
          check "com.apple.developer.game-center" "Game Center"

          [ -z "$missing" ] || exit 1

      - name: Write ExportOptions.plist
        run: |
          cat > ios/ci-export-options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.karimkod.dotto</key>
              <string>com.karimkod.dotto AppStore</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: Build signed IPA
        run: |
          flutter build ipa --release \
            --build-name=${{ steps.version.outputs.VERSION_NAME }} \
            --build-number=${{ steps.version.outputs.BUILD_NUMBER }} \
            --export-options-plist=ios/ci-export-options.plist

      - name: Locate IPA
        id: ipa
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Found IPA: $IPA_PATH"
          echo "path=$IPA_PATH" >> $GITHUB_OUTPUT

      - name: Upload to App Store Connect (TestFlight)
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-upload
    if: ${{ always() && needs.build-and-upload.result == 'success' && startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The IPA is already on TestFlight, so the GitHub Release carries the
      # generated notes only rather than a redundant copy.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
