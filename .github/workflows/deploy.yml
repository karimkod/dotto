name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build web --release --base-href "/dotto/"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Milliseconds, not minutes — 20 min, up from the action's 10-min
          # default. Six consecutive deploys failed with "Timeout reached" while
          # the deployment sat in_progress: GitHub accepted it within seconds and
          # then took longer than the default to finish. A step-level
          # timeout-minutes would not help, because the action aborts itself
          # first.
          timeout: 1200000
